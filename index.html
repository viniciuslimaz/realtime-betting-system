<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trader Crash - Pro Edition</title>
    <style>
        /* --- ESTILOS GERAIS --- */
        body {
            background-color: #0d1117;
            color: #e6edf3;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* --- CONTAINER DO JOGO (Híbrido PC/Mobile) --- */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 800px; /* Limite para PC */
            height: 400px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px 6px 0 0;
            box-shadow: 0 0 30px rgba(0, 255, 127, 0.1); /* Leve brilho verde no container */
        }

        /* Ajuste para telas muito curtas na vertical */
        @media (max-height: 600px) {
            #game-container { height: 50vh; }
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-bottom: 1px solid #30363d;
        }

        #overlay-numero {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 60px;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.1);
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* --- PAINEL DE CONTROLE --- */
        #painel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: #21262d;
            width: 100%;
            max-width: 800px;
            box-sizing: border-box;
            border-radius: 0 0 6px 6px;
        }

        .info-box { font-size: 14px; color: #8b949e; white-space: nowrap; }
        .valor-destaque { color: #00ff7f; font-weight: bold; font-size: 18px; text-shadow: 0 0 10px rgba(0, 255, 127, 0.3); }
        
        input {
            background: #0d1117;
            border: 1px solid #30363d;
            color: white;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
            width: 100px;
            font-weight: bold;
            font-size: 16px;
        }

        button {
            padding: 12px 40px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }

        .btn-apostar { background-color: #238636; color: white; }
        .btn-apostar:hover { background-color: #2ea043; box-shadow: 0 0 20px rgba(46, 160, 67, 0.4); }
        
        .btn-sacar { background-color: #d29922; color: black; animation: pulsar 0.5s infinite alternate; }
        .btn-sacar:hover { background-color: #e3b341; box-shadow: 0 0 20px rgba(210, 153, 34, 0.4); }

        .btn-bloqueado { background-color: #30363d; color: #6e7681; cursor: not-allowed; box-shadow: none; }
        
        @keyframes pulsar { from { transform: scale(1); box-shadow: 0 0 10px rgba(210, 153, 34, 0.5); } to { transform: scale(1.05); box-shadow: 0 0 25px rgba(210, 153, 34, 0.8); } }

        /* --- RESPONSIVIDADE MOBILE (< 600px) --- */
        @media (max-width: 600px) {
            #painel {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 15px;
                padding: 15px;
            }
            #div-botao { grid-column: span 2; width: 100%; }
            button { width: 100%; padding: 15px; font-size: 18px; }
            input { width: 100%; padding: 12px; box-sizing: border-box; }
            #overlay-numero { font-size: 15vw; }
            .info-box { text-align: center !important; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="grafico"></canvas>
        <div id="overlay-numero">Conectando...</div>
    </div>

    <div id="painel">
        <div class="info-box">
            USUÁRIO: <span id="nome-usuario" style="color:white">...</span><br>
            SALDO: <span class="valor-destaque">R$ <span id="saldo-valor">---</span></span>
        </div>

        <div style="text-align: center;">
            <input type="number" id="input-aposta" value="10.00">
        </div>

        <div id="div-botao">
            <button id="btn-acao" class="btn-bloqueado">Aguarde</button>
        </div>

        <div class="info-box" style="text-align: right;">
            STATUS<br>
            <span id="status-texto">---</span>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // --- INICIALIZAÇÃO E LOGIN ---
        let username = prompt("Digite seu nome de usuário para entrar:");
        if (!username) username = "Trader_" + Math.floor(Math.random() * 1000);
        document.getElementById('nome-usuario').innerText = username;

        const socket = io();
        
        socket.on('connect', () => {
            socket.emit('login', username);
        });

        // --- SISTEMA DE GRÁFICO (CANVAS) ---
        const canvas = document.getElementById('grafico');
        const container = document.getElementById('game-container');
        const ctx = canvas.getContext('2d');
        
        let width, height;

        // Ajusta o tamanho do canvas dinamicamente
        function resizeCanvas() {
            width = container.clientWidth;
            height = container.clientHeight;
            canvas.width = width;
            canvas.height = height;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let historicoPontos = [];
        let multiplicadorAtual = 1.00;
        let faseAtual = '';

        function desenharGrid() {
            ctx.fillStyle = "#161b22"; ctx.fillRect(0, 0, width, height);
            ctx.lineWidth = 0.5;
            ctx.strokeStyle = "rgba(48, 54, 61, 0.5)"; // Grid mais sutil
            
            // Grid adaptativo para telas pequenas
            const espacamento = width < 500 ? 40 : 50;

            for (let i = 0; i < height; i += espacamento) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(width, i); ctx.stroke(); }
            for (let i = 0; i < width; i += espacamento) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, height); ctx.stroke(); }
        }

        // --- NOVA FUNÇÃO DE DESENHO (ESTILO NEON TRADER) ---
        function desenhar() {
            // Limpa o efeito neon antes de desenhar o grid
            ctx.shadowBlur = 0;
            desenharGrid();

            if (faseAtual === 'VOANDO' || faseAtual === 'CRASH') {
                ctx.beginPath(); 
                ctx.lineWidth = 5; // Linha mais grossa
                ctx.lineCap = "round";
                
                // --- EFEITO NEON ---
                // Cor principal: Verde limão se voando, Vermelho se crash
                const corPrincipal = (faseAtual === 'CRASH') ? "#ff3838" : "#00ff7f";
                
                ctx.strokeStyle = corPrincipal;
                ctx.shadowColor = corPrincipal; // A sombra é da mesma cor da linha
                ctx.shadowBlur = 20; // O quanto a linha "brilha"

                let lastX = 0, lastY = height;

                if (historicoPontos.length > 0) {
                    ctx.moveTo(0, height);
                    for (let i = 0; i < historicoPontos.length; i++) {
                        let escalaX = width < 500 ? 1.5 : 2.5;
                        let x = i * escalaX; 
                        let y = height - ((historicoPontos[i] - 1) * 50); 
                        if (y < 20) y = 20;
                        ctx.lineTo(x, y);

                        if (i === historicoPontos.length - 1) {
                            lastX = x;
                            lastY = y;
                        }
                    }
                    ctx.stroke(); 

                    // --- BOLINHA BRILHANTE NA PONTA (PULSO DO MERCADO) ---
                    if (faseAtual === 'VOANDO') {
                        ctx.beginPath();
                        ctx.fillStyle = "#ffffff"; // Miolo branco para destacar
                        ctx.shadowBlur = 30; // Bolinha brilha mais ainda
                        ctx.arc(lastX, lastY, 6, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }
            requestAnimationFrame(desenhar);
        }
        desenhar();

        // --- CONTROLE DE ESTADO E INTERFACE ---
        let saldo = 0;
        let minhaAposta = 0;
        let jogando = false;
        let jaSacou = false;

        const btn = document.getElementById('btn-acao');
        const elSaldo = document.getElementById('saldo-valor');
        const elStatus = document.getElementById('status-texto');
        const elOverlay = document.getElementById('overlay-numero');
        const inputAposta = document.getElementById('input-aposta');

        inputAposta.onblur = function() {
            let valor = parseFloat(this.value);
            if (isNaN(valor) || valor < 1) valor = 10.00;
            this.value = valor.toFixed(2);
        };

        // --- AÇÃO DO BOTÃO (APOSTAR / SACAR) ---
        btn.onclick = () => {
            if (faseAtual === 'APOSTAS' && !jogando) {
                const valor = parseFloat(inputAposta.value);
                
                // UX: Feedback imediato
                btn.innerText = "Processando...";
                btn.className = "btn-bloqueado"; 
                
                socket.emit('apostar', valor);
                minhaAposta = valor; 
            } 
            else if (faseAtual === 'VOANDO' && jogando && !jaSacou) {
                socket.emit('sacar', { valorApostado: minhaAposta, multiplicador: multiplicadorAtual });
                jaSacou = true;
                btn.className = "btn-bloqueado";
                btn.innerText = "SACADO!";
            }
        };

        // --- COMUNICAÇÃO COM O SERVIDOR (SOCKET.IO) ---
        
        socket.on('saldo_inicial', (valor) => {
            saldo = valor;
            elSaldo.innerText = saldo.toFixed(2);
        });

        socket.on('aposta_aceita', (dados) => {
            saldo = dados.novoSaldo;
            elSaldo.innerText = saldo.toFixed(2);
            jogando = true;
            jaSacou = false;
            btn.innerText = "APOSTADO";
            btn.className = "btn-bloqueado";
        });

        socket.on('saque_sucesso', (dados) => {
            saldo = dados.novoSaldo;
            elSaldo.innerText = saldo.toFixed(2);
            jogando = false;
            elStatus.innerText = `LUCRO: R$ ${dados.ganho.toFixed(2)}`;
            elStatus.style.color = "#00ff7f"; // Verde neon
            elStatus.style.textShadow = "0 0 10px rgba(0, 255, 127, 0.5)";
        });

        socket.on('fase', (fase) => {
            faseAtual = fase;
            if (fase === 'APOSTAS') {
                historicoPontos = [];
                multiplicadorAtual = 1.00;
                elOverlay.innerText = "";
                elStatus.innerText = "Apostas Abertas";
                elStatus.style.color = "white";
                elStatus.style.textShadow = "none";
                if (jogando) jogando = false;
                btn.className = "btn-apostar";
                btn.innerText = "APOSTAR";
            } 
            else if (fase === 'VOANDO') {
                if (jogando) {
                    btn.className = "btn-sacar";
                    btn.innerText = "SACAR";
                } else {
                    btn.className = "btn-bloqueado";
                    btn.innerText = "EM JOGO";
                    elStatus.innerText = "Mercado em Alta...";
                    elStatus.style.color = "#8b949e";
                }
            } 
            else if (fase === 'CRASH') {
                elStatus.innerText = "MERCADO QUEBROU!";
                elStatus.style.color = "#ff3838"; // Vermelho neon
                elStatus.style.textShadow = "0 0 10px rgba(255, 56, 56, 0.5)";
                btn.className = "btn-bloqueado";
                btn.innerText = "CRASH";
            }
        });

        socket.on('subindo', (valor) => {
            multiplicadorAtual = parseFloat(valor);
            historicoPontos.push(multiplicadorAtual);
            elOverlay.innerText = valor + "x";
            elOverlay.style.color = "#00ff7f"; // Verde neon
            elOverlay.style.textShadow = "0 0 20px rgba(0, 255, 127, 0.5)";
            if (jogando && !jaSacou) {
                const ganho = (minhaAposta * multiplicadorAtual).toFixed(2);
                btn.innerText = `SACAR R$ ${ganho}`;
            }
        });

        socket.on('crash', (valor) => {
            multiplicadorAtual = valor;
            elOverlay.innerText = valor + "x";
            elOverlay.style.color = "#ff3838"; // Vermelho neon
            elOverlay.style.textShadow = "0 0 20px rgba(255, 56, 56, 0.5)";
        });

        socket.on('tempo', (t) => {
            elOverlay.innerText = `Início em ${t}s`;
            elOverlay.style.color = "#8b949e";
            elOverlay.style.textShadow = "none";
        });

        socket.on('erro_aposta', (msg) => {
            elStatus.innerText = msg;
            elStatus.style.color = "#ff3838";
            inputAposta.style.border = "2px solid #ff3838";
            setTimeout(() => { inputAposta.style.border = "1px solid #30363d"; }, 500);
            jogando = false; 
            btn.className = "btn-apostar";
            btn.innerText = "APOSTAR";
        });
    </script>
</body>
</html>
