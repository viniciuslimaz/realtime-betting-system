<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trader Crash - Mobile Pro</title>
    <style>
        /* --- CSS GERAL --- */
        body { background-color: #0d1117; color: #e6edf3; font-family: 'Segoe UI', sans-serif; margin: 0; overflow: hidden; height: 100vh; display: grid; grid-template-rows: 50px 1fr; }
        
        /* TOPO */
        #top-bar { background: #161b22; border-bottom: 1px solid #30363d; display: flex; align-items: center; padding: 0 10px; overflow-x: auto; gap: 8px; z-index: 30; height: 50px; }
        .badge-history { padding: 4px 10px; border-radius: 12px; font-weight: bold; font-size: 12px; min-width: 35px; text-align: center; white-space: nowrap; cursor: pointer; transition: transform 0.2s; }
        
        .history-blue { background: rgba(59, 130, 246, 0.15); color: #3b82f6; border: 1px solid #3b82f6; }
        .history-green-dark { background: rgba(46, 160, 67, 0.2); color: #3fb950; border: 1px solid #3fb950; }
        .history-green-neon { background: rgba(0, 255, 127, 0.2); color: #00ff7f; border: 1px solid #00ff7f; box-shadow: 0 0 10px rgba(0, 255, 127, 0.6); font-weight: 900; }

        /* LAYOUT PRINCIPAL */
        #main-area { display: grid; grid-template-columns: 250px 1fr; height: 100%; overflow: hidden; }
        
        /* SIDEBAR (PC) */
        #sidebar { background: #21262d; border-right: 1px solid #30363d; display: flex; flex-direction: column; z-index: 25; }
        .sidebar-header { padding: 10px; border-bottom: 1px solid #30363d; font-weight: bold; color: #8b949e; display: flex; justify-content: space-between; font-size: 12px; }
        #lista-jogadores { overflow-y: auto; flex: 1; padding: 5px; }
        .player-row { display: flex; justify-content: space-between; padding: 6px; border-bottom: 1px solid #30363d; font-size: 12px; animation: fadeIn 0.3s; }
        .player-row.sacou { background: rgba(0, 255, 127, 0.1); border-radius: 4px; border: 1px solid #00ff7f; }
        .green-text { color: #00ff7f; font-weight: bold; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        /* ÁREA DO JOGO */
        #game-wrapper { position: relative; display: flex; flex-direction: column; background: #0d1117; height: 100%; overflow: hidden; }
        #ambient-glow { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, rgba(0,255,127,0) 0%, rgba(0,255,127,0) 50%); pointer-events: none; z-index: 1; transition: background 0.1s; }
        
        /* CANVAS FLEXÍVEL */
        #canvas-container { flex: 1; position: relative; width: 100%; min-height: 150px; } /* Garante altura mínima pro gráfico */
        canvas { display: block; width: 100%; height: 100%; }
        
        #overlay-numero { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 60px; font-weight: 900; color: rgba(255, 255, 255, 0.2); pointer-events: none; z-index: 10; transition: transform 0.1s, text-shadow 0.1s, color 0.1s; white-space: nowrap; }
        
        #fairness-bar { position: absolute; top: 10px; left: 10px; font-size: 10px; color: #484f58; display: flex; align-items: center; gap: 5px; z-index: 40; cursor: pointer; background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 4px; border: 1px solid #30363d; }
        #user-bar { position: absolute; top: 10px; right: 10px; background: rgba(22, 27, 34, 0.8); padding: 4px 10px; border-radius: 15px; border: 1px solid #30363d; z-index: 30; font-size: 12px; font-weight: bold; }

        /* --- CONTROLES DE APOSTA --- */
        #bet-controls-container { 
            width: 100%; background: #161b22; border-top: 1px solid #30363d; 
            padding: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; 
            box-sizing: border-box; z-index: 20; 
            /* Altura fixa ou auto dependendo do conteúdo */
        }

        .bet-panel { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
        
        .bet-row-top { display: flex; align-items: center; gap: 8px; width: 100%; }
        .input-wrapper { flex: 1; position: relative; }
        input { background: #161b22; border: 1px solid #30363d; color: white; padding: 8px; border-radius: 4px; text-align: center; font-weight: bold; font-size: 16px; width: 100%; box-sizing: border-box; }
        
        button.action-btn { 
            width: 100px; height: 45px; font-size: 14px; font-weight: bold; border: none; 
            border-radius: 4px; cursor: pointer; text-transform: uppercase; transition: 0.2s; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; 
        }

        .bet-row-bottom { display: flex; justify-content: space-between; align-items: center; }
        .quick-buttons { display: flex; gap: 4px; }
        .quick-btn { background: #21262d; border: 1px solid #30363d; color: #8b949e; border-radius: 10px; padding: 4px 8px; font-size: 10px; cursor: pointer; }
        
        .auto-container { display: flex; align-items: center; gap: 4px; font-size: 10px; color: #8b949e; }
        .switch { position: relative; display: inline-block; width: 30px; height: 16px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #30363d; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 10px; width: 10px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #238636; }
        input:checked + .slider:before { transform: translateX(14px); }

        .btn-apostar { background-color: #238636; color: white; box-shadow: 0 3px 0 #1a6328; }
        .btn-apostar:active { transform: translateY(2px); box-shadow: 0 1px 0 #1a6328; }
        .btn-sacar { background-color: #d29922; color: black; animation: pulsar 0.5s infinite; }
        .btn-bloqueado { background-color: #30363d; color: #6e7681; cursor: not-allowed; }
        @keyframes pulsar { 0% { transform: scale(1); } 50% { transform: scale(1.03); box-shadow: 0 0 15px #d29922; } 100% { transform: scale(1); } }

        /* --- MODAL MOBILE FRIENDLY --- */
        #modal-fairness { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-content { background: #161b22; border: 1px solid #30363d; border-radius: 8px; width: 95%; max-width: 600px; padding: 15px; box-shadow: 0 0 50px rgba(0,0,0,0.8); font-family: 'Consolas', monospace; position: relative; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
        .modal-title { font-size: 16px; font-weight: bold; color: #58a6ff; }
        .fair-section { margin-bottom: 15px; background: #0d1117; padding: 10px; border-radius: 6px; border: 1px solid #30363d; }
        .fair-value { word-break: break-all; color: #e6edf3; font-size: 11px; }

        /* --- MEDIA QUERIES (O SEGREDO DO MOBILE) --- */
        @media (max-width: 800px) {
            /* 1. Muda layout geral para Coluna */
            #main-area { grid-template-columns: 1fr; grid-template-rows: 1fr auto; } 
            
            /* 2. Sidebar vai para baixo ou some (vamos esconder para focar no jogo) */
            /* Se quiser mostrar, coloque height: 200px. Aqui vou esconder para ganhar espaço */
            #sidebar { display: none; } 

            /* 3. Área de Jogo ocupa tudo */
            #game-wrapper { order: 1; height: 100%; }

            /* 4. Painel de Apostas: Fica um embaixo do outro se a tela for muito estreita */
            #bet-controls-container {
                display: flex; /* Muda de Grid para Flex Coluna */
                flex-direction: column;
                gap: 10px;
                padding-bottom: 20px; /* Espaço pro dedo */
                max-height: 40vh; /* Limita altura */
                overflow-y: auto; /* Permite rolar se o celular for minúsculo */
            }

            .bet-panel { padding: 10px; }
            .action-btn { width: 100px; }
            
            /* Ajuste de Texto */
            #overlay-numero { font-size: 15vw; } /* Tamanho responsivo */
        }
    </style>
</head>
<body>

    <div id="modal-fairness">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">🛡️ AUDITORIA</div>
                <div class="close-btn" onclick="document.getElementById('modal-fairness').style.display='none'" style="font-size:24px; color:#8b949e;">×</div>
            </div>
            <div class="fair-section">
                <span style="font-size:10px; color:#8b949e;">SERVER SEED</span>
                <div class="fair-value" id="modal-server-seed" style="color: #ffda6a">🔒 Oculta</div>
            </div>
            <div class="fair-section">
                <span style="font-size:10px; color:#8b949e;">CLIENT SEEDS (TOP 3)</span>
                <div id="modal-gamers-list" style="margin-top:5px;"></div>
            </div>
            <div class="fair-section">
                <span style="font-size:10px; color:#8b949e;">RESULTADO</span>
                <div class="fair-value" id="modal-result" style="color:#00ff7f; font-size:16px; font-weight:bold;">---</div>
            </div>
        </div>
    </div>

    <div id="top-bar">
        <span style="color:#8b949e; font-size:10px; margin-right:5px;">HISTÓRICO:</span>
        <div id="history-container" style="display:flex; gap:5px;"></div>
    </div>

    <div id="main-area">
        <div id="sidebar">
            <div class="sidebar-header"><span>APOSTAS</span><span id="total-players">0</span></div>
            <div id="lista-jogadores"></div>
        </div>

        <div id="game-wrapper">
            <div id="user-bar">R$ <span id="saldo-valor" style="color:#00ff7f">---</span></div>
            <div id="ambient-glow"></div> 
            
            <div id="canvas-container">
                <canvas id="grafico"></canvas>
                <div id="overlay-numero">Wait...</div>
            </div>

            <div id="fairness-bar" title="Auditar" onclick="abrirModalAtual()">
                <span>🛡️ FAIR</span>
            </div>

            <div id="bet-controls-container">
                <div class="bet-panel" id="panel-1">
                    <div class="bet-row-top">
                        <div class="input-wrapper"><input type="number" id="input-1" value="10.00" step="1.00"></div>
                        <button id="btn-1" class="action-btn btn-bloqueado"><span>...</span></button>
                    </div>
                    <div class="bet-row-bottom">
                        <div class="quick-buttons">
                            <button class="quick-btn" onclick="painel1.somar(10)">+10</button>
                            <button class="quick-btn" onclick="painel1.somar(20)">+20</button>
                            <button class="quick-btn" onclick="painel1.somar(50)">+50</button>
                        </div>
                        <div class="auto-container"><span>AUTO</span><label class="switch"><input type="checkbox" id="auto-1"><span class="slider"></span></label></div>
                    </div>
                </div>
                <div class="bet-panel" id="panel-2">
                    <div class="bet-row-top">
                        <div class="input-wrapper"><input type="number" id="input-2" value="20.00" step="1.00"></div>
                        <button id="btn-2" class="action-btn btn-bloqueado"><span>...</span></button>
                    </div>
                    <div class="bet-row-bottom">
                        <div class="quick-buttons">
                            <button class="quick-btn" onclick="painel2.somar(10)">+10</button>
                            <button class="quick-btn" onclick="painel2.somar(20)">+20</button>
                            <button class="quick-btn" onclick="painel2.somar(50)">+50</button>
                        </div>
                        <div class="auto-container"><span>AUTO</span><label class="switch"><input type="checkbox" id="auto-2"><span class="slider"></span></label></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        let username = prompt("Digite seu nome:");
        if (!username) username = "Player_" + Math.floor(Math.random()*1000);
        
        const socket = io();
        socket.on('connect', () => socket.emit('login', username));

        let faseAtual = '';
        let multiplicadorAtual = 1.00;
        let dadosRodadaAtual = {};

        const elSaldo = document.getElementById('saldo-valor');
        const elOverlay = document.getElementById('overlay-numero');
        const historyContainer = document.getElementById('history-container');
        const elGlow = document.getElementById('ambient-glow');
        const canvas = document.getElementById('grafico');
        const ctx = canvas.getContext('2d');
        const canvasContainer = document.getElementById('canvas-container');

        // --- LÓGICA DO MODAL ---
        function preencherModal(dados) {
            document.getElementById('modal-server-seed').innerText = dados.serverSeed || "🔒 Oculta";
            document.getElementById('modal-server-seed').style.color = dados.serverSeed ? "#00ff7f" : "#ffda6a";
            document.getElementById('modal-result').innerText = dados.point ? dados.point.toFixed(2)+"x" : "---";
            
            const list = document.getElementById('modal-gamers-list');
            list.innerHTML = '';
            if(dados.gamers && dados.gamers.length) {
                dados.gamers.forEach(g => {
                    list.innerHTML += `<div style="display:flex; justify-content:space-between; font-size:10px; border-bottom:1px solid #333; padding:4px;">
                        <span style="color:#58a6ff">${g.user}</span><span style="color:#888; font-family:monospace">${g.seed.substring(0,8)}...</span>
                    </div>`;
                });
            } else { list.innerHTML = '<span style="font-size:10px; color:#666">Aguardando apostas...</span>'; }
            
            document.getElementById('modal-fairness').style.display = 'flex';
        }
        function abrirModalAtual() { preencherModal(dadosRodadaAtual); }

        socket.on('hash_jogo', h => { dadosRodadaAtual = { serverHash: h }; });
        socket.on('dados_verificacao', d => { 
            dadosRodadaAtual = d; 
            if(document.getElementById('modal-fairness').style.display==='flex') preencherModal(d);
        });

        // --- PAINEL DE APOSTA ---
        class PainelAposta {
            constructor(id) {
                this.id = id;
                this.elInput = document.getElementById(`input-${id}`);
                this.elBtn = document.getElementById(`btn-${id}`);
                this.elAuto = document.getElementById(`auto-${id}`);
                this.jogando = false; this.sacou = false; this.valor = 0; this.prox = false;
                this.elBtn.onclick = () => this.clicar();
                this.elInput.onchange = () => this.elInput.value = parseFloat(this.elInput.value).toFixed(2);
            }
            somar(v) { this.elInput.value = (parseFloat(this.elInput.value||0) + v).toFixed(2); }
            clicar() {
                const val = parseFloat(this.elInput.value);
                if(faseAtual==='APOSTAS' && !this.jogando) {
                    this.elBtn.innerHTML = "Wait...";
                    socket.emit('apostar', { valor: val, id: this.id });
                    this.valor = val;
                } else if(faseAtual==='VOANDO' && this.jogando && !this.sacou) {
                    socket.emit('sacar', { id: this.id });
                    this.sacou = true; this.elBtn.className = "action-btn btn-bloqueado"; this.elBtn.innerText = "WON!";
                } else if(faseAtual==='VOANDO') {
                    this.prox = !this.prox;
                    this.elBtn.innerText = this.prox ? "NEXT" : "WAIT";
                    this.elBtn.style.border = this.prox ? "2px solid #238636" : "none";
                }
            }
            confirma() { this.jogando=true; this.sacou=false; this.elBtn.className="action-btn btn-bloqueado"; this.elBtn.innerHTML="BET<br><small>Ready</small>"; }
            
            autoCheck() {
                if(this.elAuto.checked || this.prox) {
                    this.prox=false; setTimeout(()=>this.clicar(), Math.random()*500);
                } else { this.reset('APOSTAS'); }
            }
            
            reset(fase) {
                if(fase==='APOSTAS') {
                    this.jogando=false; this.sacou=false; 
                    this.elBtn.className="action-btn btn-apostar"; 
                    this.elBtn.innerHTML=`BET<br><small>${this.elInput.value}</small>`;
                    this.elBtn.style.border="none";
                }
                if(fase==='VOANDO') {
                    if(this.jogando) { this.elBtn.className="action-btn btn-sacar"; this.elBtn.innerText="CASH OUT"; }
                    else if(!this.prox) { this.elBtn.className="action-btn btn-bloqueado"; this.elBtn.innerText="WAIT"; }
                }
                if(fase==='CRASH') { this.elBtn.className="action-btn btn-bloqueado"; this.elBtn.innerText="CRASH"; this.prox=false; }
            }
            update(m) { if(this.jogando && !this.sacou) this.elBtn.innerHTML=`CASH OUT<br><small>${(this.valor*m).toFixed(2)}</small>`; }
        }

        const p1 = new PainelAposta(1);
        const p2 = new PainelAposta(2);

        // --- SOCKETS GERAIS ---
        socket.on('saldo_inicial', v => elSaldo.innerText = v.toFixed(2));
        socket.on('aposta_aceita', d => { 
            elSaldo.innerText = d.novoSaldo.toFixed(2); 
            if(d.id===1) p1.confirma(); if(d.id===2) p2.confirma(); 
        });
        socket.on('saque_sucesso', d => elSaldo.innerText = d.novoSaldo.toFixed(2));
        socket.on('erro_aposta', d => {
            const id = d.id||1; const p = id===1?p1:p2;
            if(!p.elAuto.checked) alert(d.msg||d);
            p.reset('APOSTAS');
        });

        // LISTA SIDEBAR (Só atualiza se visível)
        socket.on('lista_apostas', l => {
            if(window.innerWidth > 800) { // Otimização: Não renderiza lista no mobile
                const list = document.getElementById('lista-jogadores');
                list.innerHTML = '';
                document.getElementById('total-players').innerText = l.length;
                l.forEach(p => {
                    const row = document.createElement('div');
                    row.className = `player-row ${p.status==='SACOU'?'sacou':''}`;
                    row.innerHTML = `<span>${p.user}</span><span>R$ ${p.valor}</span>`;
                    list.appendChild(row);
                });
            }
        });

        socket.on('historico', h => {
            historyContainer.innerHTML = '';
            h.forEach(i => {
                const b = document.createElement('div');
                b.className = 'badge-history ' + (i.point<2?'history-blue':i.point<10?'history-green-dark':'history-green-neon');
                b.innerText = i.point.toFixed(2)+'x';
                b.onclick = () => preencherModal(i);
                historyContainer.appendChild(b);
            });
        });

        socket.on('fase', f => {
            faseAtual = f;
            if(f==='APOSTAS') { p1.autoCheck(); p2.autoCheck(); elOverlay.innerText="Loading..."; elOverlay.style.color="white"; }
            else { p1.reset(f); p2.reset(f); }
            
            if(f==='CRASH') { 
                elOverlay.style.color="#ff3838"; 
                document.getElementById('game-wrapper').style.boxShadow="inset 0 0 30px rgba(255,0,0,0.5)";
                setTimeout(()=>document.getElementById('game-wrapper').style.boxShadow="none", 200);
            } else {
                elOverlay.style.transform="translate(-50%,-50%) scale(1)";
                elGlow.style.background="radial-gradient(circle, rgba(0,255,127,0) 0%, rgba(0,0,0,0) 100%)";
            }
        });

        socket.on('subindo', v => {
            multiplicadorAtual = parseFloat(v);
            elOverlay.innerText = v + "x";
            p1.update(multiplicadorAtual); p2.update(multiplicadorAtual);
            
            // Efeitos
            if(multiplicadorAtual > 1.5) {
                elOverlay.style.color = "#00ff7f";
                let scale = 1 + Math.min((multiplicadorAtual-1)/10, 0.5);
                elOverlay.style.transform = `translate(-50%, -50%) scale(${scale})`;
            }
        });

        socket.on('tempo', t => elOverlay.innerText = `Start in ${t}s`);

        // --- CANVAS RESPONSIVO ---
        let width, height;
        let historicoPontos = [];
        socket.on('fase', f => { if(f==='APOSTAS') historicoPontos=[]; });
        socket.on('subindo', v => historicoPontos.push(parseFloat(v)));

        function resize() {
            const rect = canvasContainer.getBoundingClientRect();
            canvas.width = rect.width; canvas.height = rect.height;
            width = rect.width; height = rect.height;
        }
        window.addEventListener('resize', resize);
        
        function desenhar() {
            // Garante tamanho correto
            if(width !== canvasContainer.clientWidth) resize();
            
            ctx.clearRect(0,0,width,height);
            // Grid
            ctx.strokeStyle = "rgba(255,255,255,0.05)"; ctx.lineWidth=1; ctx.beginPath();
            for(let i=0; i<width; i+=40) { ctx.moveTo(i,0); ctx.lineTo(i,height); }
            for(let i=0; i<height; i+=40) { ctx.moveTo(0,i); ctx.lineTo(width,i); }
            ctx.stroke();

            if((faseAtual==='VOANDO'||faseAtual==='CRASH') && historicoPontos.length>0) {
                let escalaX = width < 500 ? 2 : 5; // Mobile tem menos espaço
                let offsetX = 0;
                let pontaX = (historicoPontos.length-1)*escalaX;
                if(pontaX > width*0.6) offsetX = pontaX - (width*0.6);

                ctx.beginPath(); ctx.lineCap="round"; ctx.lineWidth=4;
                ctx.strokeStyle = faseAtual==='CRASH'?'#ff3838':'#00ff7f';
                ctx.shadowBlur=10; ctx.shadowColor=ctx.strokeStyle;

                let start=true;
                for(let i=0; i<historicoPontos.length; i++) {
                    let x = (i*escalaX) - offsetX;
                    let y = height - ((historicoPontos[i]-1)*30) - 20; // 30px por 1x
                    if(y<20) y=20;
                    
                    if(x>-10 && x<width+10) {
                        if(start) { ctx.moveTo(x,y); start=false; } else ctx.lineTo(x,y);
                    }
                    if(i===historicoPontos.length-1 && faseAtual==='VOANDO') {
                        ctx.stroke(); ctx.beginPath(); ctx.fillStyle="white"; ctx.arc(x,y,4,0,Math.PI*2); ctx.fill();
                    }
                }
                ctx.stroke();
            }
            requestAnimationFrame(desenhar);
        }
        resize(); desenhar();
    </script>
</body>
</html>
